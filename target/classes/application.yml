# ═══════════════════════════════════════════════════════════════
# TodoCambioYa — application.yml  |  Fase 2: PostgreSQL distribuido
# 3 nodos: Lima (5432) · Arequipa (5433) · Trujillo (5434)
# ═══════════════════════════════════════════════════════════════

spring:
  profiles:
    active: dev

  application:
    name: backend-TodoCambioYa

  # ─────────────────────────────────────────────
  # JACKSON
  # ─────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Lima

  # ─────────────────────────────────────────────
  # JPA / HIBERNATE
  # ─────────────────────────────────────────────
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Lima

  # ─────────────────────────────────────────────
  # FLYWAY — apunta siempre al nodo Lima (primario)
  # Los nodos Arequipa y Trujillo se inicializan
  # manualmente con sus respectivos V2__nodo_*.sql
  # ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

---
# ═══════════════════════════════════════════════════════════════
# PERFIL: dev
# ═══════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev

  # ─────────────────────────────────────────────
  # DATASOURCE PRINCIPAL — Lima (nodo primario)
  # Spring Boot y Flyway usan este por defecto
  # El routing a Arequipa/Trujillo lo hace
  # RegionRoutingDataSource en tiempo de ejecución
  # ─────────────────────────────────────────────
  datasource:
    url:      jdbc:postgresql://localhost:5442/todocambioya_lima
    username: ${DB_USER:tcya_user}
    password: ${DB_PASSWORD:tcya_pass_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:          HikariPool-Lima-Dev
      maximum-pool-size:  5
      minimum-idle:       2
      connection-timeout: 20000
      idle-timeout:       300000
      max-lifetime:       1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    url:      jdbc:postgresql://localhost:5432/todocambioya_lima
    user:     ${DB_USER:tcya_user}
    password: ${DB_PASSWORD:tcya_pass_local}

# ─────────────────────────────────────────────
# DATASOURCES ADICIONALES — nodos regionales
# Usados por RegionRoutingDataSource para
# redirigir queries según region_id del usuario
# ─────────────────────────────────────────────
datasource-arequipa:
  url:      jdbc:postgresql://localhost:5443/todocambioya_arequipa
  username: ${DB_USER:tcya_user}
  password: ${DB_PASSWORD:tcya_pass_local}
  driver-class-name: org.postgresql.Driver
  hikari:
    pool-name:          HikariPool-Arequipa-Dev
    maximum-pool-size:  5
    minimum-idle:       1
    connection-timeout: 20000
    idle-timeout:       300000
    max-lifetime:       1200000

datasource-trujillo:
  url:      jdbc:postgresql://localhost:5444/todocambioya_trujillo
  username: ${DB_USER:tcya_user}
  password: ${DB_PASSWORD:tcya_pass_local}
  driver-class-name: org.postgresql.Driver
  hikari:
    pool-name:          HikariPool-Trujillo-Dev
    maximum-pool-size:  5
    minimum-idle:       1
    connection-timeout: 20000
    idle-timeout:       300000
    max-lifetime:       1200000

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret:        ${JWT_SECRET:dev_secret_key_cambiar_en_produccion_minimo_256_bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root:                              INFO
    com.todocambioya:                  DEBUG
    org.springframework.security:      DEBUG
    org.flywaydb:                      INFO
    org.hibernate.SQL:                 DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info, flyway
  endpoint:
    health:
      show-details: always

---
# ═══════════════════════════════════════════════════════════════
# PERFIL: prod
# ═══════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url:      jdbc:postgresql://${DB_HOST_LIMA}:5432/todocambioya_lima
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:          HikariPool-Lima-Prod
      maximum-pool-size:  20
      minimum-idle:       5
      connection-timeout: 30000
      idle-timeout:       600000
      max-lifetime:       1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    url:      jdbc:postgresql://${DB_HOST_LIMA}:5432/todocambioya_lima
    user:     ${DB_USER}
    password: ${DB_PASSWORD}

datasource-arequipa:
  url:      jdbc:postgresql://${DB_HOST_AREQUIPA}:5433/todocambioya_arequipa
  username: ${DB_USER}
  password: ${DB_PASSWORD}
  driver-class-name: org.postgresql.Driver
  hikari:
    pool-name:          HikariPool-Arequipa-Prod
    maximum-pool-size:  15
    minimum-idle:       3
    connection-timeout: 30000
    idle-timeout:       600000
    max-lifetime:       1800000

datasource-trujillo:
  url:      jdbc:postgresql://${DB_HOST_TRUJILLO}:5434/todocambioya_trujillo
  username: ${DB_USER}
  password: ${DB_PASSWORD}
  driver-class-name: org.postgresql.Driver
  hikari:
    pool-name:          HikariPool-Trujillo-Prod
    maximum-pool-size:  15
    minimum-idle:       3
    connection-timeout: 30000
    idle-timeout:       600000
    max-lifetime:       1800000

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret:        ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root:             WARN
    com.todocambioya: INFO
    org.flywaydb:     INFO

