# ═══════════════════════════════════════════════════════════════
# TodoCambioYa — application.yml
# Perfil activo por defecto: dev
# Para producción: java -jar app.jar --spring.profiles.active=prod
# ═══════════════════════════════════════════════════════════════

spring:
  profiles:
    active: dev

  application:
    name: backend-TodoCambioYa

  # ─────────────────────────────────────────────
  # JACKSON — serialización JSON
  # ─────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null       # no incluir campos null en respuestas
    serialization:
      write-dates-as-timestamps: false          # fechas como ISO-8601, no como número
    time-zone: America/Lima

  # ─────────────────────────────────────────────
  # JPA / HIBERNATE
  # ─────────────────────────────────────────────
  jpa:
    open-in-view: false                        # evita antipatrón de sesión abierta
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Lima

  # ─────────────────────────────────────────────
  # FLYWAY — migraciones automáticas
  # Busca scripts en: src/main/resources/db/migration/
  # ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true                  # útil si la BD ya tiene tablas previas
    validate-on-migrate: true                  # falla si un script ya aplicado fue modificado
    out-of-order: false                        # los scripts deben aplicarse en orden estricto

---
# ═══════════════════════════════════════════════════════════════
# PERFIL: dev  (local con Docker)
# Activar: es el perfil por defecto
# ═══════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev

  # ─────────────────────────────────────────────
  # BASE DE DATOS — PostgreSQL Lima (Docker local)
  # Debe estar corriendo: docker compose up db-lima -d
  # ─────────────────────────────────────────────
  datasource:
    url:      jdbc:postgresql://localhost:5432/todocambioya
    username: ${DB_USER:tcya_user}
    password: ${DB_PASSWORD:tcya_pass_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:            HikariPool-Lima-Dev
      maximum-pool-size:    5           # pocos conexiones en dev está bien
      minimum-idle:         2
      connection-timeout:   20000       # 20 segundos máximo para obtener conexión
      idle-timeout:         300000      # 5 minutos antes de cerrar conexión idle
      max-lifetime:         1200000     # 20 minutos vida máxima de una conexión

  jpa:
    hibernate:
      ddl-auto: validate                # Flyway maneja el esquema, Hibernate solo valida
    show-sql: true                      # ver queries en consola (solo dev)

  flyway:
    url:      jdbc:postgresql://localhost:5432/todocambioya
    user:     ${DB_USER:tcya_user}
    password: ${DB_PASSWORD:tcya_pass_local}

# ─────────────────────────────────────────────
# SERVIDOR — dev corre en 8080
# ─────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

# ─────────────────────────────────────────────
# JWT — configuración de tokens
# ─────────────────────────────────────────────
jwt:
  secret:         ${JWT_SECRET:dev_secret_key_cambiar_en_produccion_minimo_256_bits}
  expiration-ms:  ${JWT_EXPIRATION_MS:86400000}    # 24 horas en milisegundos

# ─────────────────────────────────────────────
# LOGS — dev muestra más detalle
# ─────────────────────────────────────────────
logging:
  level:
    root:                               INFO
    com.todocambioya:                   DEBUG   # tu código en detalle
    org.springframework.security:       DEBUG   # ver qué rechaza Spring Security
    org.flywaydb:                       INFO    # ver migraciones aplicadas
    org.hibernate.SQL:                  DEBUG   # ver queries SQL
    org.hibernate.type.descriptor.sql:  TRACE   # ver parámetros de queries
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ─────────────────────────────────────────────
# ACTUATOR — endpoints de salud
# ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, flyway   # flyway muestra las migraciones aplicadas
  endpoint:
    health:
      show-details: always

---
# ═══════════════════════════════════════════════════════════════
# PERFIL: prod  (servidor de producción)
# Activar: --spring.profiles.active=prod
# Las variables DB_USER, DB_PASSWORD, JWT_SECRET deben estar
# definidas como variables de entorno en el servidor
# ═══════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url:      jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:            HikariPool-Lima-Prod
      maximum-pool-size:    20
      minimum-idle:         5
      connection-timeout:   30000
      idle-timeout:         600000
      max-lifetime:         1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false                     # nunca mostrar SQL en producción

  flyway:
    url:      jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    user:     ${DB_USER}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret:        ${JWT_SECRET}          # obligatorio en prod, sin valor por defecto
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root:             WARN
    com.todocambioya: INFO
    org.flywaydb:     INFO

  # ─────────────────────────────────────────────
