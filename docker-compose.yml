  #   networks:
  #     - todocambioya_net


# ═══════════════════════════════════════════════════════════════
# VOLÚMENES
# ═══════════════════════════════════════════════════════════════
volumes:
  db_lima_data:
  db_arequipa_data:
  db_trujillo_data:
  mongodb_data:
  # cassandra_data:  # descomentar con Fase 4


# ═══════════════════════════════════════════════════════════════
# RED
# ═══════════════════════════════════════════════════════════════
networks:
  todocambioya_net:
    driver: bridge
