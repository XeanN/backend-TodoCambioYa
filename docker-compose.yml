  #     CASSANDRA_CLUSTER_NAME: TodoCambioYaCluster
  #     CASSANDRA_DC:           datacenter_lima
  #     MAX_HEAP_SIZE:          "512M"
  #     HEAP_NEWSIZE:           "128M"
  #   ports:
  #     - "9042:9042"
  #   volumes:
  #     - cassandra_data:/var/lib/cassandra
  #   healthcheck:
  #     test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
  #     interval: 30s
