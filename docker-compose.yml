  # ═══════════════════════════════════════════════════════════════
  # HERRAMIENTA — pgAdmin (interfaz visual para PostgreSQL)
  # Acceso: http://localhost:5050
  # Login:  admin@todocambioya.com / admin123
  # ═══════════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todocambioya_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@todocambioya.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      db-lima:
        condition: service_healthy
    networks:
      - todocambioya_net


# ═══════════════════════════════════════════════════════════════
# VOLÚMENES — persisten los datos aunque el contenedor se detenga
# ═══════════════════════════════════════════════════════════════
volumes:
  db_lima_data:
  # db_arequipa_data:   # descomentar con Fase 2
  # db_trujillo_data:   # descomentar con Fase 2
  # mongodb_data:       # descomentar con Fase 3
  # cassandra_data:     # descomentar con Fase 4


# ═══════════════════════════════════════════════════════════════
# RED — todos los servicios se comunican internamente
# ═══════════════════════════════════════════════════════════════
networks:
  todocambioya_net:
    driver: bridge