services:

  # ═══════════════════════════════════════════════════════════════
  # FASE 1 — PostgreSQL Lima (nodo principal)
  # Comando para levantar: docker compose up db-lima -d
  # ═══════════════════════════════════════════════════════════════
  db-lima:
    image: postgres:16-alpine
    container_name: todocambioya_db_lima
    restart: unless-stopped
    environment:
      POSTGRES_DB:       todocambioya_lima
      POSTGRES_USER:     ${DB_USER:-tcya_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tcya_pass_local}
    ports:
      - "5432:5432"
    volumes:
      - db_lima_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tcya_user} -d todocambioya_lima"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todocambioya_net


  # ═══════════════════════════════════════════════════════════════
