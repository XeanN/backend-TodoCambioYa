services:

  # ═══════════════════════════════════════════════════════════════
  # FASE 2 — PostgreSQL Lima (nodo principal :5432)
  # ═══════════════════════════════════════════════════════════════
  db-lima:
    image: postgres:16-alpine
    container_name: todocambioya_db_lima
    restart: unless-stopped
    environment:
      POSTGRES_DB:       todocambioya_lima
      POSTGRES_USER:     ${DB_USER:-tcya_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tcya_pass_local}
    ports:
      - "5442:5432"
    volumes:
      - db_lima_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tcya_user} -d todocambioya_lima"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todocambioya_net


  # ═══════════════════════════════════════════════════════════════
  # FASE 2 — PostgreSQL Arequipa (nodo sur :5433)
  # ═══════════════════════════════════════════════════════════════
  db-arequipa:
    image: postgres:16-alpine
    container_name: todocambioya_db_arequipa
    restart: unless-stopped
    environment:
      POSTGRES_DB:       todocambioya_arequipa
      POSTGRES_USER:     ${DB_USER:-tcya_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tcya_pass_local}
    ports:
      - "5443:5432"
    volumes:
      - db_arequipa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tcya_user} -d todocambioya_arequipa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todocambioya_net


  # ═══════════════════════════════════════════════════════════════
  # FASE 2 — PostgreSQL Trujillo (nodo norte :5434)
  # ═══════════════════════════════════════════════════════════════
  db-trujillo:
    image: postgres:16-alpine
    container_name: todocambioya_db_trujillo
    restart: unless-stopped
    environment:
      POSTGRES_DB:       todocambioya_trujillo
      POSTGRES_USER:     ${DB_USER:-tcya_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tcya_pass_local}
    ports:
      - "5444:5432"
    volumes:
      - db_trujillo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tcya_user} -d todocambioya_trujillo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todocambioya_net


  # ═══════════════════════════════════════════════════════════════
  # HERRAMIENTA — pgAdmin (interfaz visual para los 3 nodos)
  # Acceso: http://localhost:5050
  # Login:  admin@todocambioya.com / admin123
  # Conectar manualmente los 3 servidores desde la UI de pgAdmin
  # ═══════════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todocambioya_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@todocambioya.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      db-lima:
        condition: service_healthy
      db-arequipa:
        condition: service_healthy
      db-trujillo:
        condition: service_healthy
    networks:
      - todocambioya_net


  # ═══════════════════════════════════════════════════════════════
  # FASE 3 — MongoDB (datos no estructurados)
  # Descomentar cuando llegues a la fase MongoDB
  # ═══════════════════════════════════════════════════════════════
  mongodb:
    image: mongo:7
    container_name: todocambioya_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-tcya_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-tcya_mongo_local}
      MONGO_INITDB_DATABASE:      todocambioya_docs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./src/main/resources/mongodb/init-collections.js:/docker-entrypoint-initdb.d/init-collections.js:ro
    networks:
      - todocambioya_net


  # ═══════════════════════════════════════════════════════════════
  # FASE 4 — Cassandra (escrituras masivas)
  # Descomentar cuando llegues a la fase Cassandra
  # ═══════════════════════════════════════════════════════════════
